<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Информирование при ЧС — MVP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-body theme-pro">
  <!-- Верхняя панель -->
  <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary shadow-sm nav-pro">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Безопасность · ЧС</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#emergencies">Ситуации</a></li>
          <li class="nav-item"><a class="nav-link" href="#plans">Планы эвакуации</a></li>
          <li class="nav-item"><a class="nav-link" href="#videos">Видео</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin">Админ-панель</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero py-5 border-bottom border-secondary hero-pro">
    <div class="container">
      <h1 class="display-6 fw-bold mb-2 text-uppercase letter-spaced">Действия в чрезвычайных ситуациях</h1>
      <p class="lead text-body-secondary mb-0">
      </p>
    </div>
  </header>

  <main class="container py-4">
    <div id="alert-root" class="mb-3"></div>

    <div class="row g-4">
      <!-- Список ЧС -->
      <aside class="col-lg-4" id="emergencies">
        <div class="card shadow-sm border border-secondary h-100 card-pro">
          <div class="card-header fw-semibold text-uppercase small letter-spaced">Тип чрезвычайной ситуации</div>
          <div class="card-body p-0">
            <div id="emergency-list" class="list-group list-group-flush emergency-list">
              <div class="p-3 text-secondary small">Загрузка списка…</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Контент выбранной ЧС -->
      <section class="col-lg-8">
        <div id="emergency-empty" class="alert alert-secondary border border-secondary">
          Выберите ситуацию из списка, чтобы увидеть рекомендации и материалы.
        </div>

        <div id="emergency-detail" class="d-none">
          <div class="card shadow-sm border border-secondary mb-4 card-pro">
            <div class="card-body">
              <h2 id="detail-title" class="h4 mb-2 fw-semibold"></h2>
              <p id="detail-short" class="text-body-secondary mb-3"></p>
              <div id="detail-reco" class="reco-content"></div>
            </div>
          </div>

          <!-- Интерактивный план -->
          <div id="plans" class="card shadow-sm border border-secondary mb-4 card-pro">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
              <span class="fw-semibold text-uppercase small letter-spaced">Интерактивные планы эвакуации</span>
              <div class="btn-group btn-group-sm" role="group" id="plan-tabs"></div>
            </div>
            <div class="card-body">
              <p id="plan-desc" class="small text-body-secondary mb-2"></p>
              <div class="map-shell position-relative mx-auto">
                <!-- Слой изображения -->
                <img id="plan-image" class="plan-image" alt="План этажа" src="">
                <!-- SVG: маршрут и подсветка -->
                <svg id="plan-overlay" class="plan-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                <!-- Кликабельные зоны -->
                <div id="plan-zones" class="plan-zones"></div>
              </div>
              <p id="zone-hint" class="mt-3 small text-accent fw-medium mb-0"></p>
            </div>
          </div>

          <!-- Видео -->
          <div id="videos" class="card shadow-sm border border-secondary mb-4 card-pro">
            <div class="card-header fw-semibold text-uppercase small letter-spaced">Видеоинструкции (Rutube)</div>
            <div class="card-body">
              <div id="video-list" class="row g-3"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-top border-secondary py-4 mt-auto footer-pro">
    <div class="container small text-body-secondary">
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
