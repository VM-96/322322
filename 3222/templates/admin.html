<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — ЧС MVP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-body theme-pro">
  <nav class="navbar navbar-dark border-bottom border-secondary nav-pro">
    <div class="container">
      <a class="navbar-brand" href="/">← На главную</a>
      <span class="navbar-text text-white-50 small">Управление контентом</span>
    </div>
  </nav>

  <main class="container py-4">
    <div id="admin-alerts"></div>

    <!-- Блок входа -->
    <section id="login-section" class="card shadow-sm border border-secondary mx-auto card-pro" style="max-width:420px">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Вход администратора</h1>
        <p class="small text-body-secondary">По умолчанию: <code>admin</code> / <code>admin123</code> (смените пароль в продакшене).</p>
        <form id="login-form" class="vstack gap-2">
          <input type="text" class="form-control" name="username" placeholder="Логин" required autocomplete="username">
          <input type="password" class="form-control" name="password" placeholder="Пароль" required autocomplete="current-password">
          <button type="submit" class="btn btn-primary">Войти</button>
        </form>
      </div>
    </section>

    <!-- Панель после входа -->
    <section id="admin-panel" class="d-none">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Админ-панель</h1>
        <div>
          <span class="me-2 small text-body-secondary" id="admin-user-label"></span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-logout">Выйти</button>
        </div>
      </div>

      <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-em" type="button">ЧС</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-plans" type="button">Планы</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-vid" type="button">Видео</button>
        </li>
      </ul>
      <div class="tab-content border border-secondary border-top-0 rounded-bottom p-3 shadow-sm card-pro">
        <!-- ЧС -->
        <div class="tab-pane fade show active" id="tab-em" role="tabpanel">
          <h2 class="h6 text-uppercase text-body-secondary">Создать ЧС</h2>
          <form id="form-em-create" class="row g-2 mb-4 small">
            <div class="col-md-3"><input class="form-control" name="code" placeholder="Код (лат., fire)" required></div>
            <div class="col-md-4"><input class="form-control" name="title" placeholder="Заголовок" required></div>
            <div class="col-md-2"><input class="form-control" name="sort_order" type="number" value="0" placeholder="Порядок"></div>
            <div class="col-12"><input class="form-control" name="short_description" placeholder="Краткое описание"></div>
            <div class="col-12"><textarea class="form-control" name="recommendations" rows="3" placeholder="Рекомендации (допускается простой HTML)"></textarea></div>
            <div class="col-12"><button class="btn btn-primary btn-sm" type="submit">Добавить</button></div>
          </form>
          <h2 class="h6 text-uppercase text-body-secondary">Список и редактирование</h2>
          <div id="emergency-admin-list" class="vstack gap-2"></div>
        </div>
        <!-- Планы -->
        <div class="tab-pane fade" id="tab-plans" role="tabpanel">
          <p class="small text-body-secondary">Загрузите изображение плана (PNG, JPG, SVG…). Поле JSON описывает зоны клика и линию маршрута.</p>
          <form id="form-plan-create" class="row g-2 mb-3 small">
            <div class="col-md-4">
              <select class="form-select" name="emergency_id" id="plan-em-select" required></select>
            </div>
            <div class="col-md-4"><input class="form-control" name="title" placeholder="Название плана" required></div>
            <div class="col-md-2"><input class="form-control" name="sort_order" type="number" value="0"></div>
            <div class="col-12"><input class="form-control" name="description" placeholder="Описание"></div>
            <div class="col-12">
              <label class="form-label mb-0">hotspots_json</label>
              <textarea class="form-control font-monospace small" name="hotspots_json" rows="8">{
  "zones": [
    {"id": "z1", "label": "Зона А", "x": 10, "y": 10, "w": 30, "h": 25, "hint": "Текст подсказки"},
    {"id": "z2", "label": "Выход", "x": 60, "y": 50, "w": 25, "h": 30, "hint": "Направляйтесь к выходу"}
  ],
  "route": {"label": "Маршрут", "points": [[20, 22], [72, 65]]}
}</textarea>
            </div>
            <div class="col-12"><input class="form-control" type="file" name="image" accept="image/*" required></div>
            <div class="col-12"><button class="btn btn-primary btn-sm" type="submit">Загрузить план</button></div>
          </form>
          <div id="plans-admin-list" class="vstack gap-3"></div>
        </div>
        <!-- Видео -->
        <div class="tab-pane fade" id="tab-vid" role="tabpanel">
          <form id="form-video-create" class="row g-2 mb-3 small">
            <div class="col-md-4">
              <select class="form-select" name="emergency_id" id="video-em-select" required></select>
            </div>
            <div class="col-md-4"><input class="form-control" name="title" placeholder="Заголовок" required></div>
            <div class="col-md-2"><input class="form-control" name="sort_order" type="number" value="0"></div>
            <div class="col-12"><input class="form-control" name="description" placeholder="Описание"></div>
            <div class="col-md-6"><input class="form-control" name="author_name" placeholder="Автор / подразделение (как в БД)"></div>
            <div class="col-md-6"><input class="form-control" name="rutube_id" placeholder="ID ролика Rutube (из ссылки play/embed/…)"></div>
            <div class="col-12"><input class="form-control" name="rutube_id" placeholder="Опционально: ID rutube для старых записей"></div>
            <div class="col-md-6"><input class="form-control" type="file" name="video_file" accept="video/*"></div>
            <div class="col-12"><button class="btn btn-primary btn-sm" type="submit">Добавить видео</button></div>
          </form>
          <div id="videos-admin-list" class="vstack gap-2"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
